<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t-normale"><title id="t-normale">Confronto fra il modello senza e con la classe normale nella prova dal vivo</title><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="#f7f6f2" /><text x="64.0" y="86.0" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" font-size="46" font-weight="700" fill="#1e2227" text-anchor="start" >Perché serve la classe "normale"</text><text x="64.0" y="126.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="#4b5058" text-anchor="start" >Un classificatore sceglie sempre una delle classi che conosce. Senza "niente", inventa.</text><rect x="64.0" y="200.0" width="720.0" height="520.0" rx="16" fill="#ffffff" stroke="#d4d2ca" stroke-width="1.5" /><rect x="64.0" y="200.0" width="720.0" height="10.0" rx="0" fill="#7a7f87" /><text x="104.0" y="266.0" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" font-size="26" font-weight="700" fill="#1e2227" text-anchor="start" >v1 · 3 classi</text><text x="104.0" y="450.0" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" font-size="170" font-weight="700" fill="#1e2227" text-anchor="start" >11</text><text x="104.0" y="500.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="600" fill="#1e2227" text-anchor="start" >falsi allarmi in 7 minuti</text><text x="104.0" y="570.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#4b5058" text-anchor="start" >telefono puntato su una stanza:</text><text x="104.0" y="600.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#4b5058" text-anchor="start" >tavoli e zaini scambiati per</text><text x="104.0" y="630.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#4b5058" text-anchor="start" >cassonetti e rifiuti, fino al 98%</text><rect x="816.0" y="200.0" width="720.0" height="520.0" rx="16" fill="#ffffff" stroke="#d4d2ca" stroke-width="1.5" /><rect x="816.0" y="200.0" width="720.0" height="10.0" rx="0" fill="#e3a008" /><text x="856.0" y="266.0" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" font-size="26" font-weight="700" fill="#1e2227" text-anchor="start" >v2 · + normale</text><text x="856.0" y="450.0" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" font-size="170" font-weight="700" fill="#1e2227" text-anchor="start" >0</text><text x="856.0" y="500.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="26" font-weight="600" fill="#1e2227" text-anchor="start" >segnalazioni su 178 foto</text><text x="856.0" y="570.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#4b5058" text-anchor="start" >stessa stanza, stesso telefono:</text><text x="856.0" y="600.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#4b5058" text-anchor="start" >195 frame di esempio bastano</text><text x="856.0" y="630.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="400" fill="#4b5058" text-anchor="start" >a insegnare cos'è "niente"</text><text x="64.0" y="790.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="18" font-weight="400" fill="#7a7f87" text-anchor="start" >Le 11 segnalazioni della v1 sono rimaste sulla board e non sono mai arrivate alla piattaforma.</text></svg>