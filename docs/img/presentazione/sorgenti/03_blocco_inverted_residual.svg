<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t-blocco"><title id="t-blocco">Il blocco inverted residual di MobileNetV2 e il risparmio di calcoli</title><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="var(--paper, #f7f6f2)" /><text x="64.0" y="86.0" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" font-size="46" font-weight="700" fill="var(--ink, #1e2227)" text-anchor="start" >Il mattone della rete: il blocco inverted residual</text><text x="64.0" y="126.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="start" >17 blocchi in fila. Esempio con i numeri reali di un blocco a 14×14 e 96 canali</text><polygon points="110,285.0 124,271.0 160,271.0 146,285.0" fill="var(--panel2, #eeede7)" stroke="var(--ink2, #4b5058)" stroke-width="1" opacity="0.75"/><polygon points="146,285.0 160,271.0 160,501.0 146,515.0" fill="var(--panel2, #eeede7)" stroke="var(--ink2, #4b5058)" stroke-width="1" opacity="0.55"/><rect x="110.0" y="285.0" width="36.0" height="230.0" rx="2" fill="var(--panel2, #eeede7)" stroke="var(--ink2, #4b5058)" stroke-width="1" /><text x="135.0" y="555.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="var(--ink, #1e2227)" text-anchor="middle" >ingresso</text><text x="135.0" y="579.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="middle" >14×14×96</text><line x1="164.0" y1="400.0" x2="249.0" y2="400.0" stroke="var(--ink, #1e2227)" stroke-width="2.5"/><polygon points="260.0,400.0 249.0,393.9 249.0,406.1" fill="var(--ink, #1e2227)"/><polygon points="266,285.0 280,271.0 400,271.0 386,285.0" fill="var(--panel2, #eeede7)" stroke="var(--ink2, #4b5058)" stroke-width="1" opacity="0.75"/><polygon points="386,285.0 400,271.0 400,501.0 386,515.0" fill="var(--panel2, #eeede7)" stroke="var(--ink2, #4b5058)" stroke-width="1" opacity="0.55"/><rect x="266.0" y="285.0" width="120.0" height="230.0" rx="2" fill="var(--panel2, #eeede7)" stroke="var(--ink2, #4b5058)" stroke-width="1" /><text x="333.0" y="555.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="var(--ink, #1e2227)" text-anchor="middle" >1×1 espansione</text><text x="333.0" y="579.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="middle" >14×14×576</text><text x="333.0" y="600.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="middle" >ReLU6</text><line x1="404.0" y1="400.0" x2="489.0" y2="400.0" stroke="var(--ink, #1e2227)" stroke-width="2.5"/><polygon points="500.0,400.0 489.0,393.9 489.0,406.1" fill="var(--ink, #1e2227)"/><polygon points="506,285.0 520,271.0 640,271.0 626,285.0" fill="var(--accent-soft, #f7e7bd)" stroke="var(--accent, #e3a008)" stroke-width="1" opacity="0.75"/><polygon points="626,285.0 640,271.0 640,501.0 626,515.0" fill="var(--accent-soft, #f7e7bd)" stroke="var(--accent, #e3a008)" stroke-width="1" opacity="0.55"/><rect x="506.0" y="285.0" width="120.0" height="230.0" rx="2" fill="var(--accent-soft, #f7e7bd)" stroke="var(--accent, #e3a008)" stroke-width="1" /><text x="573.0" y="555.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="var(--ink, #1e2227)" text-anchor="middle" >3×3 depthwise</text><text x="573.0" y="579.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="middle" >un filtro per canale</text><text x="573.0" y="600.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="middle" >ReLU6</text><line x1="644.0" y1="400.0" x2="729.0" y2="400.0" stroke="var(--ink, #1e2227)" stroke-width="2.5"/><polygon points="740.0,400.0 729.0,393.9 729.0,406.1" fill="var(--ink, #1e2227)"/><polygon points="746,285.0 760,271.0 796,271.0 782,285.0" fill="var(--panel2, #eeede7)" stroke="var(--ink2, #4b5058)" stroke-width="1" opacity="0.75"/><polygon points="782,285.0 796,271.0 796,501.0 782,515.0" fill="var(--panel2, #eeede7)" stroke="var(--ink2, #4b5058)" stroke-width="1" opacity="0.55"/><rect x="746.0" y="285.0" width="36.0" height="230.0" rx="2" fill="var(--panel2, #eeede7)" stroke="var(--ink2, #4b5058)" stroke-width="1" /><text x="771.0" y="555.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="var(--ink, #1e2227)" text-anchor="middle" >1×1 proiezione</text><text x="771.0" y="579.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="middle" >14×14×96</text><text x="771.0" y="600.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="middle" >lineare</text><circle cx="938" cy="400" r="26" fill="var(--panel, #ffffff)" stroke="var(--ink, #1e2227)" stroke-width="2.5"/><text x="938.0" y="410.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="30" font-weight="700" fill="var(--ink, #1e2227)" text-anchor="middle" >+</text><line x1="800.0" y1="400.0" x2="899.0" y2="400.0" stroke="var(--ink, #1e2227)" stroke-width="2.5"/><polygon points="910.0,400.0 899.0,393.9 899.0,406.1" fill="var(--ink, #1e2227)"/><line x1="966.0" y1="400.0" x2="1021.0" y2="400.0" stroke="var(--ink, #1e2227)" stroke-width="2.5"/><polygon points="1032.0,400.0 1021.0,393.9 1021.0,406.1" fill="var(--ink, #1e2227)"/><text x="1042.0" y="406.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="600" fill="var(--ink, #1e2227)" text-anchor="start" >uscita</text><path d="M128.0 269.0 V215.0 H938 V370" stroke="var(--ink2, #4b5058)" stroke-width="2.5" fill="none" stroke-dasharray="8 6"/><polygon points="938,373 932,360 944,360" fill="var(--ink2, #4b5058)"/><text x="520.0" y="203.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="middle" >scorciatoia residua: l'ingresso si somma all'uscita</text><text x="425.0" y="251.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="var(--muted, #7a7f87)" text-anchor="middle" >stretto → largo → stretto: per questo "invertito"</text><text x="64.0" y="684.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="18" font-weight="600" fill="var(--ink, #1e2227)" text-anchor="start" >Moltiplicazioni per uno strato 3×3 da 96 a 96 canali su 14×14</text><rect x="314.0" y="712.0" width="600.0" height="34.0" rx="4" fill="var(--norm, #7d828a)" /><text x="64.0" y="735.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="start" >convoluzione 3×3 normale</text><text x="924.0" y="735.0" font-family="'IBM Plex Mono',Consolas,monospace" font-size="16" font-weight="600" fill="var(--ink, #1e2227)" text-anchor="start" >16,3 M</text><rect x="314.0" y="764.0" width="72.9" height="34.0" rx="4" fill="var(--accent, #e3a008)" /><text x="64.0" y="787.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="start" >depthwise 3×3 + 1×1</text><text x="396.9" y="787.0" font-family="'IBM Plex Mono',Consolas,monospace" font-size="16" font-weight="600" fill="var(--ink, #1e2227)" text-anchor="start" >2,0 M</text><text x="1034.0" y="758.0" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" font-size="64" font-weight="700" fill="var(--ink, #1e2227)" text-anchor="start" >8,2×</text><text x="1034.0" y="790.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="20" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="start" >meno calcoli</text><text x="1170.0" y="240.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #1e2227)" text-anchor="start" >Perché MobileNetV2</text><text x="1170.0" y="268.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="start" >Le convoluzioni depthwise separabili</text><text x="1170.0" y="291.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="start" >costano ~8 volte meno: la rete gira</text><text x="1170.0" y="314.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="start" >sui 4 core della UNO Q in 41 ms.</text><text x="1170.0" y="390.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="19" font-weight="700" fill="var(--ink, #1e2227)" text-anchor="start" >Perché ReLU6</text><text x="1170.0" y="418.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="start" >Limita i valori fra 0 e 6: stanno bene</text><text x="1170.0" y="441.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="start" >in 8 bit, per questo la versione int8</text><text x="1170.0" y="464.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="16" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="start" >non perde accuratezza (98,0%).</text></svg>