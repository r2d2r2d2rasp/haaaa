<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t-decisione"><title id="t-decisione">I tre filtri che trasformano una foto in segnalazione</title><rect x="0.0" y="0.0" width="1600.0" height="900.0" rx="0" fill="var(--paper, #f7f6f2)" /><text x="64.0" y="86.0" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" font-size="46" font-weight="700" fill="var(--ink, #1e2227)" text-anchor="start" >Quando una foto diventa una segnalazione</text><text x="64.0" y="126.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="22" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="start" >Tre filtri in fila sulla UNO Q: una foto passa solo se li supera tutti</text><rect x="64.0" y="260.0" width="150.0" height="140.0" rx="10" fill="var(--panel2, #eeede7)" stroke="var(--line, #d4d2ca)" stroke-width="1.5" /><text x="139.0" y="328.0" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" font-size="22" font-weight="700" fill="var(--ink, #1e2227)" text-anchor="middle" >foto</text><text x="139.0" y="354.0" font-family="'IBM Plex Sans','Segoe UI',Arial,sans-serif" font-size="15" font-weight="400" fill="var(--ink2, #4b5058)" text-anchor="middle" >dal telefono</text><line x1="218.0" y1="330.0" x2="247.0" y2="330.0" stroke="var(--ink, #1e2227)" stroke-width="2.5"/><polygon points="258.0,330.0 247.0,323.9 247.0,336.1" fill="var(--ink, #1e2227)"/><rect x="262.0" y="260.0" width="170.0" height="140.0" rx="10" fill="var(--accent-soft, #f7e7bd)" stroke="var(--accent, #e3a008)" stroke-width="2.5" /><text x="347.0" y="300.0" font-family="'IBM Plex Sans Condensed','Arial Narrow',sans-serif" font-size="22" font-weight="700" fill="var(--ink, #1e2227)" text-anchor="middle" >modello</text><rect x="284.0" y="318.0" width="117.6" height="12.0" rx="2" fill="var(--buca, #2a78d6)" /><rect x="284.0" y="336.0" width="3.0" height="12.0" rx="2" fill="var(--rif, #1baf7a)" /><rect x="284.0" y="354